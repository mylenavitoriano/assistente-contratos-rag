name: assistente-contratos

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contratos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contratos}
      POSTGRES_DB: ${POSTGRES_DB:-contratos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-contratos} -d ${POSTGRES_DB:-contratos}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      target: production
    image: assistente-contratos-backend:production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-contratos}:${POSTGRES_PASSWORD:-contratos}@db:5432/${POSTGRES_DB:-contratos}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_QUERY_PREFIX: '${EMBEDDING_QUERY_PREFIX:-query: }'
      EMBEDDING_PASSAGE_PREFIX: '${EMBEDDING_PASSAGE_PREFIX:-passage: }'
      MODEL_CACHE_DIR: /app/.model-cache
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-0}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-40}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RRF_K: ${RRF_K:-60}
      HISTORY_MAX_TURNS: ${HISTORY_MAX_TURNS:-6}
    ports:
      - '${BACKEND_PORT:-3333}:3333'
    volumes:
      - model_cache:/app/.model-cache
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3333/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  pgdata:
  model_cache:
